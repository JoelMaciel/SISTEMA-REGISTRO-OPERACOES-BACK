version: '3.8'

services:
  db:
    image: postgres:15
    container_name: siscof
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: siscof
    ports:
      - '5432:5432'
    volumes:
      - pgdata_siscof:/var/lib/postgresql/data

volumes:
  pgdata_siscof:
